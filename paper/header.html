<script type="module">
  import mermaid from "https://cdn.jsdelivr.net/npm/mermaid@10/dist/mermaid.esm.min.mjs";
  mermaid.initialize({ startOnLoad: true, theme: "default" });
  // pandoc renders ```mermaid blocks as <pre class="mermaid"> with a <code> inside.
  // Mermaid expects the diagram text directly inside .mermaid, so unwrap.
  document.addEventListener("DOMContentLoaded", () => {
    for (const pre of document.querySelectorAll("pre.mermaid, pre > code.mermaid, pre > code.language-mermaid")) {
      const wrapper = pre.tagName === "PRE" ? pre : pre.parentElement;
      const text = (pre.tagName === "PRE" ? pre.querySelector("code") || pre : pre).textContent;
      const div = document.createElement("div");
      div.className = "mermaid";
      div.textContent = text;
      wrapper.replaceWith(div);
    }
    mermaid.run();
  });
</script>
